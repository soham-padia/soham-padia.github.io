<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Soham Padia</title>
  <script>
    // GitHub Pages SPA redirect. Only /blog/* is a client-side app: keep the
    // /blog segment and encode the rest as a query string so blog/index.html
    // can restore it via history.replaceState. Anything else goes home.
    var l = window.location;
    if (l.pathname.indexOf('/blog/') === 0) {
      var pathSegmentsToKeep = 1;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    } else {
      l.replace('/');
    }
  </script>
</head>
<body></body>
</html>
